name: Update Requirements & Publish Release

on:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install deps
        run: |
          pip install pytest-cov pytest
          pip install -e .

      - name: Test
        run: |
          pytest --cov=src/ tests/

  update-reqs-formatting-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pipreqs toml black sphinx sphinx-autodoc-typehints sphinx-rtd-theme myst-parser

      - name: Get onto Main
        run: |
          git fetch
          git checkout main

      - name: Generate requirements.txt
        run: |
          pipreqs ./src --force
          if ! git diff --quiet --cached; then
            git add -u
            echo "Updated requirements and pyproject."
            git commit -m "Auto-update requirements.txt and pyproject.toml (GH Action)."
          fi   
          mv ./src/requirements.txt ./

      - name: Update pyproject.toml
        run: python .github/scripts/fill_toml_reqs.py

      - name: Format with black
        run: |
          black src/
          black tests/
          if ! git diff --quiet --cached; then
            git add -u
            echo "□~V□□□~O Black edits staged."
            git commit -m "□~V□□□~O Black edits (GH Action)."
          fi   

      - name: Build docs
        run: | 
          make html
          if ! git diff --quiet --cached; then
            git add -u
            echo "□~_~S~V Doc edits staged."
            git commit -m "□~_~S~V doc edits by sphinx (GH Action)."
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git push origin main --force
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  build-and-publish:
    needs: update-reqs-formatting-docs
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install build tools
        run: pip install toml build twine

      - name: Update Version
        run: python .github/scripts/set_version.py

      - name: Build the package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GH_PYPI }}
        run: twine upload dist/*

      - name: Publish pre-release
        run: |
          TAG_NAME=$(git describe --tags --abbrev=0)
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -d "{\"tag_name\":\"$TAG_NAME\",\"name\":\"Release $TAG_NAME\",\"draft\":false,\"prerelease\":true}" \
            https://api.github.com/repos/${{ github.repository }}/releases
